    const v = val(x), changed = over[x.id] && over[x.id].v !== x.p;
    html += `<div class="row"><span class="q">${esc(x.q)}${changed ? "<small>Corrigée par toi</small>" : ""}</span><div class="sw" role="group" aria-label="Classement"><button class="s ${v === "soft" ? "on" : ""}" data-id="${x.id}" data-v="soft" aria-pressed="${v === "soft"}">Soft</button><button class="t ${v === "trash" ? "on" : ""}" data-id="${x.id}" data-v="trash" aria-pressed="${v === "trash"}">Trash</button></div></div>`;
  });
  $("list").innerHTML = html;
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.tab){ tab = b.dataset.tab; render(); return; }
  if (!b.dataset.id) return;
  const x = ITEMS.find(i => i.id === b.dataset.id), v = b.dataset.v;
  if (val(x) === v) return;
  const prev = over[x.id]; over[x.id] = { v, q: x.q }; render();
  if (!db){ toast("Pas enregistré : ouvre la page dans claude.ai"); return; }
  try { await db.collection("softtrash").doc(x.id).set({ v, q: x.q, mine: x.p, at: new Date().toISOString() }); }
  catch(err){ if (prev) over[x.id] = prev; else delete over[x.id]; render(); toast("Pas enregistré, réessaie."); }
});
render();
(async () => {
  db = await (window.claude && window.claude.use ? window.claude.use("db") : null);
  if (!db){ $("err").innerHTML = `<p class="err">Tes corrections ne peuvent pas être enregistrées ici. Ouvre cette page dans claude.ai en étant connecté.</p>`; return; }
  const tm = setTimeout(() => { $("err").innerHTML = `<p class="err">Chargement lent, recharge la page si rien ne bouge.</p>`; }, 10000);
  db.collection("softtrash").limit(1000).onSnapshot(snap => {
    clearTimeout(tm); $("err").innerHTML = "";
    const o = {}; snap.docs.forEach(d => { const x = d.data(); if (x && (x.v === "soft" || x.v === "trash")) o[d.id] = x; });
    over = o; render();
  }, () => { clearTimeout(tm); $("err").innerHTML = `<p class="err">Impossible de charger tes corrections.</p>`; });
})();
})();
</script>
