<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dawa</title>
<meta name="theme-color" content="#14279a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" href="icon-192.png?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dawa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600;700&family=Pirata+One&display=swap">
<style>
/* Layout : appli plein écran, une colonne de cartes posées sur une table cobalt */
:root{
  --table:#1f3bd1; --table-deep:#14279a; --card:#fff7e8; --ink:#16130f;
  --hot:#ff5a36; --hot-deep:#b8381d; --muted:#5d564c; --line:#e6dcc8; --gold:#ffc83d;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,var(--table) 0%,var(--table-deep) 100%) fixed;background-color:var(--table-deep);color:var(--card);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:18px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.logo span{color:var(--gold)}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:999px}
h1,h2{font-family:var(--display);font-weight:800;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,8vw,42px);line-height:1.05}
h2{font-size:22px;line-height:1.15}
p{margin:0}
.lead{opacity:.88}
.center{text-align:center}
.card{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:stretch}
label,.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.label.light{color:rgba(255,247,232,.75)}
input,textarea{font:inherit;font-size:max(16px,1em);color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
textarea{min-height:110px;resize:none;font-size:19px;font-weight:600;line-height:1.3}
input:focus,textarea:focus{outline:none;border-color:var(--hot)}
.codein{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:.35em;text-align:center;padding:10px 0 10px .35em;font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:15px 18px;cursor:pointer;transition:transform .08s;color:inherit}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button[data-busy]:disabled{opacity:1;cursor:progress;transform:translateY(2px);filter:brightness(.9)}
.btn{background:var(--hot);color:#fff;font-size:18px;width:100%;box-shadow:0 5px 0 var(--hot-deep)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 #b88a10}
.ghost{background:transparent;color:var(--card);border:2px solid rgba(255,247,232,.4);width:100%}
.ghost.dark{color:var(--ink);border-color:var(--line)}
.small{padding:10px 14px;font-size:14px}
.link{background:none;padding:6px 4px;font-weight:600;font-size:14px;color:rgba(255,247,232,.8);text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:#fff;color:var(--ink);border:2px solid var(--line);padding:10px 6px;font-size:15px}
.seg button.on{border-color:var(--hot);background:#ffe6de}
.or{display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.or::before,.or::after{content:"";flex:1;height:1px;background:rgba(255,247,232,.35)}
/* Carte à trous */
.black{background:var(--ink);color:var(--card);border-radius:20px;padding:24px 22px 20px;box-shadow:0 10px 0 rgba(0,0,0,.25);font-family:var(--display);font-weight:800;font-size:clamp(23px,6.4vw,30px);line-height:1.18;letter-spacing:-.01em;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;text-wrap:pretty}
.black .brand{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--gold);height:.9em;vertical-align:baseline}
mark{background:none;color:var(--hot);font-weight:800}
.black mark{color:var(--gold)}
/* Réponses */
.answers{display:grid;gap:14px}
.answer{text-align:left;background:var(--card);color:var(--ink);border-radius:18px;padding:18px;font-family:var(--display);font-size:21px;font-weight:500;line-height:1.25;box-shadow:0 8px 0 rgba(0,0,0,.18);border:3px solid transparent;width:100%}
.answer .num{display:block;font-family:var(--body);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
.answer.sel{border-color:var(--hot)}
.answer.facedown{display:flex;flex-direction:column;justify-content:space-between;min-height:96px;background:repeating-linear-gradient(135deg,var(--ink) 0 14px,#221e19 14px 28px);color:var(--card)}
.answer.facedown .num{color:rgba(255,247,232,.6)}
.answer .back{font-family:var(--display);font-weight:800;font-size:20px;color:var(--gold);letter-spacing:-.01em}
.timer{display:flex;align-items:center;gap:12px}
.timer .tnum{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;min-width:3.2ch}
.timer .bar{flex:1;height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .25s linear}
.timer.urgent .tnum{color:var(--hot)}
.timer.urgent .bar i{background:var(--hot)}
.answer.win{border-color:var(--gold);background:#fff1c7}
.answer .by{display:block;font-family:var(--body);font-size:14px;font-weight:700;color:var(--hot);margin-top:10px}
/* Joueurs */
.players{display:grid;gap:6px}
.pl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.09);font-variant-numeric:tabular-nums}
.pl.me{background:rgba(255,255,255,.18)}
.pl.top{background:rgba(255,200,61,.22)}
.pl .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .rt{display:flex;align-items:center;gap:10px;flex-shrink:0}
.pl b{font-family:var(--display);font-size:20px}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.16)}
.pill.ok{background:#2fbf71;color:#04230f}
.pill.judge{background:var(--gold);color:var(--ink)}
.x{background:rgba(255,255,255,.16);padding:3px 9px;border-radius:999px;font-size:14px}
/* Lobby */
.codebig{font-family:var(--display);font-weight:800;font-size:clamp(56px,18vw,84px);letter-spacing:.12em;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;text-align:center}
.qr{background:#fff;border-radius:16px;padding:12px;width:min(220px,62vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.qr svg{width:100%;height:100%;display:block}
.big-name{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,58px);line-height:1;color:var(--gold);word-break:break-word}
.wait{display:flex;align-items:center;gap:10px;justify-content:center;opacity:.9}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--card);margin:0 2px;animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.preview{font-family:var(--display);font-size:18px;font-weight:500;line-height:1.3;color:var(--muted)}
.preview mark{color:var(--hot)}
.err{background:#ffe0d8;color:#7a1c06;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.foot{margin-top:auto;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding-top:8px}
.counter{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.hr{display:flex;align-items:center;gap:8px}
.snd{background:rgba(255,255,255,.12);padding:7px;border-radius:999px;line-height:0;display:inline-flex}
.menu{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.mhead .ghost{width:auto}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:none;color:var(--ink);text-align:left;padding:12px 2px;border-radius:0;border-top:1px solid var(--line);font-weight:600}
.mrow b{display:block;font-size:16px}
.mrow small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.mrow .chev{font-size:24px;color:var(--muted);line-height:1}
.sw{flex-shrink:0;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--hot)}.sw.on::after{left:21px}
.hint{font-size:13px;opacity:.75}
.row.wrap{flex-wrap:wrap}.row.wrap>*{flex:1;min-width:150px}
.pill.gone{background:rgba(0,0,0,.25);color:rgba(255,247,232,.8)}
.pl.away{opacity:.55}
/* Coup de cœur */
.heart{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;border:2px solid var(--line);color:var(--ink);font-family:var(--body);font-size:14px;padding:8px 12px;border-radius:999px}
.heart.on{background:#ffe1ea;border-color:#e8436b;color:#a3173b}
.answer.voted{border-color:#e8436b}
.answer .mine{display:block;margin-top:10px;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fav{display:flex;flex-direction:column;gap:8px}
.answer.heartwin{border-color:#e8436b;background:#ffe9ef}
.answer.heartwin .by{color:#a3173b}
/* Insignes */
.badges-now{display:flex;flex-direction:column;gap:10px}
.bgrid{display:flex;flex-wrap:wrap;gap:12px}
.bx{background:var(--card);color:var(--ink);font-size:11px;font-weight:800;border-radius:999px;padding:2px 5px;font-variant-numeric:tabular-nums}
.bmed{display:flex;flex-direction:column;align-items:center;gap:5px;width:88px;text-align:center}
.bmed .disc{position:relative;width:58px;height:58px;border-radius:50%;background:var(--bc);display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,247,232,.9),0 5px 0 rgba(0,0,0,.25)}
.bmed .bn{font-size:12px;font-weight:700;line-height:1.15}
.bmed .bw{font-size:12px;opacity:.75;line-height:1.1}
.bmed .bx{position:absolute;right:-6px;top:-6px}
body.tv .bmed{width:110px}body.tv .bmed .disc{width:74px;height:74px}body.tv .bmed .bn,body.tv .bmed .bw{font-size:15px}
.brow{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.09);border-radius:14px;padding:12px 14px}
.brow .nm{font-weight:700}
/* Notation des cartes */
.rate{display:flex;align-items:center;justify-content:center;gap:4px;font-size:13px;color:rgba(255,247,232,.55);margin-top:8px}
.rate button{background:none;border:0;padding:6px 8px;font:inherit;font-weight:600;color:rgba(255,247,232,.7);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.rate button.on{color:var(--gold);text-decoration:none}
.ghost.on{background:rgba(255,200,61,.25);border-color:var(--gold)}
/* Réactions */
.reacts{display:flex;gap:10px;justify-content:center}
.reacts button{background:rgba(255,255,255,.14);font-size:28px;padding:8px 18px;border-radius:999px;line-height:1}
.fly{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:fly 2.6s ease-out forwards}
.fly .em{font-size:44px;line-height:1}
.fly .who{font-size:12px;font-weight:700;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px;margin-top:2px;white-space:nowrap}
@keyframes fly{0%{transform:translateY(0) scale(.6);opacity:0}12%{transform:translateY(-30px) scale(1.1);opacity:1}100%{transform:translateY(-55vh) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){@keyframes fly{0%{opacity:0}15%{opacity:1}100%{opacity:0}}}
/* Statistiques des cartes */
.srow{display:flex;justify-content:space-between;gap:12px;background:rgba(255,255,255,.09);border-radius:12px;padding:10px 14px;font-size:15px}
.srow b{white-space:nowrap;font-variant-numeric:tabular-nums}
.srow mark,.srow .blank{color:var(--gold)}
.tbar{display:flex;flex-direction:column;gap:5px}
.tbar .tl{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.tbar .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.tbar .bar i{display:block;height:100%;background:var(--gold)}
.help{display:flex;flex-direction:column;gap:18px}.help section{display:flex;flex-direction:column;gap:6px}.help h3{font-family:var(--display);font-weight:800;font-size:19px;margin:0;color:var(--gold)}.help p{opacity:.9;max-width:62ch}
/* Choix du jeu */
.hl{display:flex;align-items:center;gap:10px}
.snd.back{padding:7px}
h1.choose{font-size:clamp(34px,10vw,48px);line-height:1.02;margin-top:8px}
.gamecards{display:grid;gap:16px}
.gamecard{display:flex;flex-direction:column;gap:14px;text-align:left;border-radius:22px;padding:22px 20px;box-shadow:0 8px 0 rgba(0,0,0,.25);color:var(--card);position:relative;overflow:hidden}
.gamecard .logo{font-size:34px}
.nextgames{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mg{background:var(--card);color:var(--ink);border-radius:16px;padding:12px 6px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.mg .logo{font-size:19px}
.mg .logo span{color:var(--hot)}
.lobbygame{gap:10px}
.instbar{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--card);color:var(--ink);border-radius:18px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,.35);max-width:520px;margin:0 auto}
.instic{width:44px;height:44px;border-radius:11px;background:var(--table);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;line-height:.95;text-align:center;flex-shrink:0}
.instic span{color:var(--gold)}
.insttx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.insttx b{font-family:var(--display);font-size:17px}
.insttx small{font-size:13px;font-weight:600;color:var(--muted)}
.btn.instgo{width:auto;padding:10px 14px;font-size:15px}
.instx{width:32px;height:32px;padding:0;border-radius:50%;background:rgba(22,19,15,.1);color:var(--ink);font-size:18px;flex-shrink:0}
.instarrow{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.instarrow{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translate(-50%,5px)}}}
#app:has(.instbar){padding-bottom:130px}
.custom{gap:8px}
.custom .row{display:flex;gap:8px}
.custom input{flex:1;min-width:0}
.btn.cadd{width:auto;padding:12px 18px;font-size:22px;line-height:1}
.cardrow{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border-radius:12px;padding:8px 8px 8px 10px;font-weight:700;font-size:15px;line-height:1.25}
.cardrow span{flex:1;min-width:0}
.cardrow i{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--hot-deep);flex-shrink:0}
.cardrow .x{width:30px;height:30px;padding:0;border-radius:50%;background:rgba(22,19,15,.1);color:var(--ink);font-size:18px;flex-shrink:0}
.vibe{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vb{border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:opacity .15s}
.vb b{font-family:var(--display);font-size:22px;line-height:1}
.vb small{font-size:13px;font-weight:600;opacity:.9;letter-spacing:0;text-transform:none}
.vb.s{background:#3f8cff;color:#fff}
.vb.t{background:var(--hot);color:#fff}
.vb.off{opacity:.4;box-shadow:none}
.vb.on{outline:3px solid var(--gold);outline-offset:2px}
.vb.on:disabled{cursor:default;opacity:1}
.vb.off:disabled{display:none}
.vibe:has(.vb.off:disabled){grid-template-columns:1fr}
.biglogo .logo{font-size:38px}
.swap{background:rgba(255,255,255,.12);color:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px}
.gamecard ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-weight:600;font-size:16px}
.gamecard li{display:flex;gap:10px;align-items:baseline}
.gamecard li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;transform:translateY(-1px)}
.gamecard.punchline{background:var(--ink)}
.gamecard.qui{background:#0e1a6e;padding-left:38px}
.gamecard.qui::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:linear-gradient(var(--hot),var(--gold) 45%,#6fb7ff)}
.gamecard.qui li::before{background:var(--hot)}

/* Le Verdict (ex « Qui de nous ») : thermomètre (style B choisi par Naim) */
.gname{font-family:var(--display);font-weight:800;font-size:22px}
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.46);line-height:1;color:var(--ink);background:var(--c);flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.av.xs{--s:22px;box-shadow:none}.av.sm{--s:30px;box-shadow:none}.av.lg{--s:58px}.av.xl{--s:96px}
.av.inv{background:var(--card)}
.av.photo{background:var(--c) center/cover no-repeat;box-shadow:0 0 0 3px var(--c),0 3px 0 3px rgba(0,0,0,.25)}
.av.photo.xs,.av.photo.sm{box-shadow:0 0 0 2px var(--c)}
.selfie{position:relative;display:inline-block;cursor:pointer;border-radius:50%}
.selfie input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.selfie:focus-within{outline:3px solid var(--gold);outline-offset:3px}
.selfie .cam{position:absolute;right:-4px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.25);pointer-events:none}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qtop .timer{flex:1}
.qtop .timer .tnum{font-size:22px}
.rnd{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:999px;white-space:nowrap}
.rnd.hotpill{background:var(--gold);color:var(--ink)}
